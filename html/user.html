<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScenarijPro - Postavke korisničkog računa</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Relativni CSS link -->
  <link rel="stylesheet" href="../css/user.css" />
</head>
<body>
  <div class="page-wrap">
    <form class="settings-form">
      <!-- Naslov + opis -->
      <header class="settings-header">
        <h1>Postavke korisničkog računa</h1>
        <hr class="title-divider">
        <p class="settings-subtitle">
          <em>Upravljajte vašim korisničkim računom, sigurnosnim postavkama i notifikacijama.</em>
        </p>
      </header>

      <!-- Podaci o korisničkom računu -->
      <section class="settings-section section-account">
        <h2 class="section-title blue">Podaci o korisničkom računu</h2>

        <div class="form-row">
          <label class="form-label" for="full-name">Ime i prezime</label>
          <div class="field-control">
            <input type="text" id="full-name" name="full-name"
                   placeholder="Unesite ime i prezime" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label" for="email">Email adresa</label>
          <div class="field-control">
            <input type="email" id="email" name="email"
                   placeholder="npr. korisnik@example.com" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label" for="items-per-page">Broj elemenata po stranici (1–100)</label>
          <div class="field-control">
            <input type="number" id="items-per-page" name="items-per-page"
                   min="1" max="100" step="1" placeholder="25" />
          </div>
        </div>
      </section>

      <!-- Sigurnosne postavke -->
      <section class="settings-section section-security">
        <h2 class="section-title red">Sigurnosne postavke</h2>

        <div class="form-row">
          <label class="form-label" for="new-password">Nova šifra</label>
          <div class="field-control">
            <input type="password" id="new-password" name="new-password"
                   placeholder="Unesite novu šifru" />
            <p class="field-hint">Ostavite prazno ukoliko ne želite mijenjati trenutnu šifru.</p>
          </div>
        </div>

        <div class="form-row form-row-single">
          <div class="field-control checkbox-row">
            <input type="checkbox" id="enable-2fa" name="enable-2fa" />
            <label for="enable-2fa">Omogući Two-Factor Authentication (2FA)</label>
          </div>
        </div>
      </section>

      <!-- Notifikacije -->
      <section class="settings-section section-notifications">
        <h2 class="section-title green">Notifikacije</h2>

        <div class="form-row">
          <label class="form-label">Preferirani način komunikacije</label>
          <div class="field-control radio-group">
            <label class="radio-option">
              <input type="radio" name="contact-method" value="email" checked />
              <span>Email</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="contact-method" value="sms" />
              <span>SMS</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="contact-method" value="none" />
              <span>None</span>
            </label>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label" for="notification-frequency">Notification frequency</label>
          <div class="field-control">
            <select id="notification-frequency" name="notification-frequency">
              <option value="daily" selected>Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="never">Never</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Dugme -->
      <div class="form-actions">
        <button type="submit" class="btn-primary">Spasi promjene</button>
      </div>
    </form>
  </div>
</body>
</html>
